name: Deploy NonProd

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: (NonProd) Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: (NonProd) Deploy dev QGIS Projects to S3
        run: |
          ./scripts/deploy.sh "$PWD/map-series/nztopo50map/nz-topo50-map.qgs" \
            --strategy commit=${{ github.sha }} \
            --source s3://linz-topography-nonprod/data/catalog.json \
            --target s3://linz-topography-nonprod/qgis/ \
            --commit

      - name: (NonProd) Deploy dev QGIS Projects to S3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          ./scripts/deploy.sh "$PWD/map-series/nztopo50map/nz-topo50-map.qgs" \
            --strategy latest \
            --strategy commit=${{ github.sha }} \
            --source s3://linz-topography-nonprod/data/catalog.json \
            --target s3://linz-topography-nonprod/qgis/ \
            --commit