name: Deploy NonProd

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: (NonProd) Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: (NonProd) Deploy dev QGIS Projects to S3
        run: |
          # TODO: Update DATA_TAG once latest data is available in s3
          DATA_TAG=next;
          ./scripts/deploy.sh --project "$PWD/map-series/" --tag ${{ github.sha }} --source s3://linz-topography-nonprod/data/catalog.json --data-tag $DATA_TAG --target s3://linz-topography-nonprod/qgis/ --commit

      - name: (NonProd) Deploy latest QGIS Projects to S3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          # TODO: Update DATA_TAG once latest data is available in s3
          DATA_TAG=next; 
          ./scripts/deploy.sh --project "$PWD/map-series/" --tag latest --githash ${{ github.sha }} --source s3://linz-topography-nonprod/data/catalog.json --data-tag $DATA_TAG  --target s3://linz-topography-nonprod/qgis/ --commit
