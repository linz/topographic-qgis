name: Deploy NonProd

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint QGIS Project
        run: |
          ./scripts/lint.sh "$PWD/map-series/nztopo50/nztopo50.qgs"

      - name: (NonProd) Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: (NonProd) Prepare and deploy QGIS Projects to local deploy directory
        run: |
          ./scripts/ts-map.sh deploy \
            "$PWD/map-series/nztopo50/nztopo50.qgs" \
            --source s3://linz-topography-nonprod/data/catalog.json \
            --target $PWD/deploy \

      - name: (NonProd) Push commit deploy to S3
        run: |
          ./scripts/ts-map.sh stac-push \
            --source $PWD/deploy/catalog.json \
            --target s3://linz-topography-nonprod/ \
            --category qgis \
            --strategy commit=${{ github.sha }} \
            --commit

      - name: (NonProd) Push latest deploy to S3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          ./scripts/ts-map.sh stac-push \
            --source $PWD/deploy/catalog.json \
            --target s3://linz-topography-nonprod/ \
            --category qgis \
            --strategy latest \
            --strategy commit=${{ github.sha }} \
            --commit
