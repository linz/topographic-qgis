name: DeployNonProd

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: (NonProd) Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: (NonProd) Deploy dev QGIS Projects to S3
        run: |
          ./scripts/script.sh deploy --project "$PWD/map-series/" --tag ${{ github.sha }} --source s3://linz-topography-nonprod/data/catalog.json --data-tag latest --target s3://linz-topography-nonprod/ --commit

      - name: (NonProd) Deploy latest QGIS Projects to S3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          ./scripts/script.sh deploy --project "$PWD/map-series/" --tag latest --githash ${{ github.sha }} --source s3://linz-topography-nonprod/data/catalog.json --data-tag latest --target s3://linz-topography-nonprod/ --commit

      - name: Produce mapsheets
        run: |
          ./scripts/script.sh visual-diff --output $PWD/.artifacts/visual-snapshots --project s3://linz-topography-nonprod/qgis/${{ github.sha }}/nztopo50map/nz-topo50-map.json

      - name: Save snapshots
        uses: linz/action-visual-snapshot@v2.1
        with:
          save-only: true
          snapshot-path: .artifacts/visual-snapshots

  visual-diff:
    environment: nonprod
    permissions:
      id-token: write
      contents: write
      checks: write
    needs: [deploy]
    name: Compare Visual Diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_ROLE_SCREENSHOT }}

      - name: Diff snapshots
        id: visual-snapshots-diff
        uses: linz/action-visual-snapshot@v2.1
        with:
          storage-prefix: "s3://linz-topography-screenshot-nonprod"
          storage-url: "https://d2glsbt6gvd4ll.cloudfront.net"
