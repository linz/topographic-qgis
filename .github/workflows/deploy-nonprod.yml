name: deploy-nonprod

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    outputs:
      project_path: ${{ steps.project_path.outputs.project_path }}
    env:
      # `github.sha` is the ephemeral merge commit on pull requests, use the head commit instead
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lint QGIS Project
        run: |
          ./scripts/lint.sh "$PWD/map-series/nztopo50/nztopo50.qgs"

      - name: (NonProd) Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: (NonProd) Prepare and deploy QGIS Projects to local deploy directory
        run: |
          ./scripts/ts-map.sh deploy \
            "$PWD/map-series/nztopo50/nztopo50.qgs" \
            --source s3://linz-topography-nonprod/data/catalog.json \
            --target "$PWD/deploy" \
            --extra-assets "$PWD/fonts/"

      - name: Get Commit Path for the project
        id: project_path
        run: |
          first_char="${COMMIT_SHA:0:1}"
          echo "project_path=https://d1jzh93b1t1cv.cloudfront.net/qgis/nztopo50/commit_prefix=${first_char}/commit=${COMMIT_SHA}/nztopo50.json" >> "$GITHUB_OUTPUT"

      - name: (NonProd) Push commit deploy to S3
        run: |
          ./scripts/ts-map.sh stac-push \
            --source "$PWD/deploy/catalog.json" \
            --target s3://linz-topography-nonprod/ \
            --category qgis \
            --strategy "commit=${COMMIT_SHA}" \
            --commit

      - name: (NonProd) Push latest deploy to S3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          ./scripts/ts-map.sh stac-push \
            --source "$PWD/deploy/catalog.json" \
            --target s3://linz-topography-nonprod/ \
            --category qgis \
            --strategy latest \
            --strategy "commit=${COMMIT_SHA}" \
            --commit

  visual-diff:
    needs: deploy
    uses: linz/topographic-system/.github/workflows/visual-diff.yml@master
    with:
      environment: nonprod
      map_version: "latest"
      project: ${{ needs.deploy.outputs.project_path }}
    secrets: inherit
