name: deploy-nonprod

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: (NonProd) Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: (NonProd) Deploy PR QGIS Projects to S3
        if: github.event_name == 'pull_request'
        run: |
          ./scripts/deploy.sh \
            --project "$PWD/map-series/" \
            --tag pull_request=${{ github.event.pull_request.number }} \
            --githash ${{ github.sha }} \
            --source s3://linz-topography-nonprod/data/catalog.json \
            --data-tag latest \
            --target s3://linz-topography-nonprod/ \
            --commit

      - name: (NonProd) Deploy latest QGIS Projects to S3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          ./scripts/deploy.sh \
            --project "$PWD/map-series/" \
            --tag latest \
            --githash ${{ github.sha }} \
            --source s3://linz-topography-nonprod/data/catalog.json \
            --data-tag latest \
            --target s3://linz-topography-nonprod/ \
            --commit

  visual-diff:
    needs: deploy
    uses: linz/topographic-system/.github/workflows/visual-diff.yml@master
    with:
      environment: nonprod
      map_version: "latest"
      project: s3://linz-topography-nonprod/qgis/nztopo50map/pull_request=${{ github.event.pull_request.number }}/nztopo50map/nz-topo50-map.json
    secrets: inherit
